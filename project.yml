name: NamazPause
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""   # set your Apple team id
targets:
  NamazPause:
    type: application
    platform: iOS
    sources: [Sources/App, Sources/Core, Sources/Views]
    entitlements:
      path: NamazPause.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.namazpause]
    info:
      path: Info.plist
      properties:
        NSCameraUsageDescription: Photos are analysed on this device to confirm prayer or wake-up. Nothing is uploaded.
        NSLocationWhenInUseUsageDescription: Used to calculate prayer times offline.
        NSAlarmKitUsageDescription: Rings the Fajr alarm.
        UILaunchScreen: {}
    dependencies:
      - target: PrayerMonitor
  PrayerMonitor:
    type: app-extension
    platform: iOS
    sources: [Sources/Monitor, Sources/Core/SharedStore.swift]
    entitlements:
      path: PrayerMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.namazpause]
    info:
      path: PrayerMonitor/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PrayerMonitor
  NamazPauseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: NamazPause
